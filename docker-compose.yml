name: assistansportal

services:
  postgres:
    image: postgres:16-alpine
    container_name: assistansportal_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: assistans
      POSTGRES_PASSWORD: assistans_local
      POSTGRES_DB: assistansportal
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
